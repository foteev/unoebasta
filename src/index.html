<!doctype html>

<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141828" media="(prefers-color-scheme: dark)">

<title>unoebasta</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: phone-first single column. Catalog = stack of award slips; Awards = years × categories board;
   work, author and reader views slide over as full-height sheets. */
:root {
  --bg: #eef1f6; --surface: #ffffff; --ink: #151a2e; --muted: #59617e; --line: #d5dae7;
  --accent: #2c3cc4; --accent-ink: #ffffff; --accent-soft: #e4e7fb;
  --gold: #8a5f00; --gold-bg: #fbf0d6; --ok: #1d6f47; --ok-bg: #e0f2e8; --warn: #7f5200; --warn-bg: #fcefd2; --bad: #a3271f; --bad-bg: #fbe5e2;
  --new: #c2410c;
  --r-bg: #fbfaf6; --r-ink: #1d1b16; --r-muted: #6d675a; --r-line: #e4dfd2;
  --f-display: 'Unbounded', 'Golos Text', system-ui, sans-serif;
  --f-ui: 'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-read: 'Literata', Georgia, 'Noto Serif', serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1020; --surface: #161a2d; --ink: #e6e8f3; --muted: #9ba2be; --line: #2a3050;
    --accent: #8f9cff; --accent-ink: #0d1020; --accent-soft: #232a52;
    --gold: #e6b955; --gold-bg: #2f2612; --ok: #72d3a2; --ok-bg: #12281e; --warn: #f0c46d; --warn-bg: #2c2412; --bad: #ff9a8f; --bad-bg: #321715;
    --new: #fb923c;
    --r-bg: #14151b; --r-ink: #dcd8cc; --r-muted: #9a9484; --r-line: #2b2c33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1020; --surface: #161a2d; --ink: #e6e8f3; --muted: #9ba2be; --line: #2a3050;
  --accent: #8f9cff; --accent-ink: #0d1020; --accent-soft: #232a52;
  --gold: #e6b955; --gold-bg: #2f2612; --ok: #72d3a2; --ok-bg: #12281e; --warn: #f0c46d; --warn-bg: #2c2412; --bad: #ff9a8f; --bad-bg: #321715;
  --new: #fb923c;
  --r-bg: #14151b; --r-ink: #dcd8cc; --r-muted: #9a9484; --r-line: #2b2c33;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { font: 700 17px/1 var(--f-display); letter-spacing: .01em; margin: 0; display: flex; align-items: center; gap: 8px; }
.brand svg { flex: none; }
.brand { white-space: nowrap; }
.brand-home { all: unset; display: inline-flex; align-items: center; gap: inherit; cursor: pointer; border-radius: 10px; -webkit-tap-highlight-color: transparent; } /* the logo leads to the start screen */
.brand-home:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.brand-e { font-weight: 300; color: var(--accent); } /* uno · e · basta: the middle «e» thinner and in colour */
.motto { margin: 16px 0 2px; font: italic 400 16px/1.4 var(--f-read); color: var(--muted); }
.intro .motto { margin: 4px 0 0; }
.intro .name-note { margin: 8px 0 0; font-size: 14px; }
.langs { margin-left: auto; display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.langs button { border: 0; background: transparent; padding: 6px 10px; font: 500 12px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; cursor: pointer; color: var(--muted); }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.tabs { display: flex; gap: 4px; padding-block: 0 8px; overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 8px 12px; border-radius: 999px; cursor: pointer; font-weight: 500; color: var(--muted); white-space: nowrap; position: relative; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); }
.tabs .dot { display: inline-block; width: 8px; height: 8px; margin-left: 6px; border-radius: 50%; background: var(--accent); vertical-align: middle; } /* a quiet dot, no number */
.iconbtn { margin-left: 8px; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--ink); cursor: pointer; font-size: 18px; line-height: 1; display: inline-grid; place-items: center; flex: none; }

main .wrap { padding-block: 18px 64px; display: grid; gap: 16px; }
.intro h2 { font: 700 22px/1.2 var(--f-display); margin: 0 0 6px; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); max-width: 62ch; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.count { margin-left: auto; color: var(--muted); font: 12px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.search { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 11px; }

/* news */
.news { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--new); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; }
.news h3 { margin: 0; font: 600 16px/1.3 var(--f-ui); }
.news ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.news li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.news li .what { font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--new); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 2px; }

/* award slips */
.slips { display: grid; gap: 10px; }
.slip { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 6px; position: relative; }
.slip:hover { border-color: var(--accent); }
.slip-open { all: unset; cursor: pointer; }
.slip-open::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius); }
.slip-open:focus-visible::after { outline: 2px solid var(--accent); outline-offset: 2px; }
.slip h3 { margin: 0; font: 600 18px/1.3 var(--f-read); text-wrap: balance; padding-right: 36px; }
.slip .star { position: absolute; top: 10px; right: 10px; z-index: 1; }
.alt { font: italic 14px/1.35 var(--f-read); color: var(--muted); }
.byline { margin: 0; color: var(--muted); font-size: 14px; }
.awards, .flags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.award { font: 500 11px/1 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; padding: 5px 7px; border-radius: 6px; background: var(--gold-bg); color: var(--gold); font-variant-numeric: tabular-nums; border: 0; }
button.award { cursor: pointer; }
.award b { font-weight: 500; opacity: .75; margin-left: 4px; }
.tier, .flag { font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tier-t1 { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.tier-t2 { background: var(--accent-soft); color: var(--ink); border-color: transparent; }
.tier-external { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.audio-source { display: grid; justify-items: start; gap: 6px; margin-top: 14px; min-width: 0; }
.audio-source .btn { max-width: 100%; overflow-wrap: anywhere; }
.tier-t2us { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.flag-reading { color: var(--ink); border-color: var(--accent); }
.flag-new { color: var(--new); border-color: var(--new); }
.star { border: 0; background: transparent; cursor: pointer; font-size: 20px; line-height: 1; padding: 6px; color: var(--muted); border-radius: 8px; }
.star[aria-pressed="true"] { color: var(--gold); }
/* read works: a quiet toggle on cards, muted rows in the lists so the eye slides past them */
.done-btn { display: inline-flex; align-items: center; gap: 7px; }
.done-btn .dk { flex: none; }
.done-btn[aria-pressed="false"] { color: var(--muted); }
.done-btn[aria-pressed="false"]:hover { color: var(--ink); }
.done-btn[aria-pressed="true"] { color: var(--ink); }
.done-btn[aria-pressed="true"] .dk { color: var(--accent); }
.done-btn .dk-c { stroke: var(--surface); }
.pick-done { justify-self: start; min-height: 40px; padding: 0 6px; margin: -6px 0 -4px -6px; border: 0; border-radius: 8px; background: none; font: 500 14px/1 var(--f-ui); cursor: pointer; }
.pick-done:hover { color: var(--ink); }
.slip.is-done h3, .slip.is-done .byline { color: var(--muted); }
.slip.is-done h3 { font-weight: 500; }
.yrow.is-done .yt, .wrow.is-done .yt { color: var(--muted); font-weight: 500; }
.yrow.is-done .ym, .wrow.is-done .ym { opacity: .45; }
.dtag { font-weight: 600; color: var(--muted); }
.cell.is-done { opacity: .5; }
.cell.is-done.has-text { background: transparent; }
.toast-act { margin-left: 12px; min-height: 32px; border: 0; background: none; padding: 0 2px; color: inherit; font: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

/* awards: phone first — pickers + lists; the full board only from 900px */
.controls { display: grid; gap: 10px; }
.seg.full { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; width: 100%; }
.seg.full button { min-height: 44px; padding: 6px 6px; line-height: 1.2; text-wrap: balance; }
.scroller { display: flex; gap: 8px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; padding-block: 2px; -webkit-overflow-scrolling: touch; }
.scroller::-webkit-scrollbar { display: none; }
.scroller > * { flex: none; }
.chip { min-height: 40px; }
.chip-small { min-height: 36px; padding: 4px 12px; font: 500 13px/1 var(--f-mono); }
.search { width: 100%; font-size: 16px; min-height: 44px; }
.count-line { margin: 0; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.ylist { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.yrow, .wrow { display: grid; align-items: stretch; border-top: 1px solid var(--line); min-height: 56px; }
.yrow:first-child, .wrow:first-child { border-top: 0; }
.yrow { grid-template-columns: 58px minmax(0, 1fr) auto; }
.wrow { grid-template-columns: minmax(0, 1fr) auto; }
.yrow .yr { all: unset; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; padding-top: 14px; font: 600 15px/1 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); border-right: 1px solid var(--line); }
button.yr { cursor: pointer; } button.yr:hover { color: var(--accent); }
.yw, .wbtn { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 3px; align-content: center; padding: 10px 12px; min-width: 0; min-height: 56px; }
.yw:hover .yt, .wbtn:hover .yt { color: var(--accent); }
.yw:focus-visible, .wbtn:focus-visible, button.yr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.yt { font: 600 16px/1.3 var(--f-read); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.ya { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wmeta { font: 500 11px/1.3 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--gold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ym { display: flex; align-items: center; gap: 6px; padding: 0 12px 0 4px; font-size: 14px; }
.ym .tm { color: var(--accent); } .ym .xm { color: var(--muted); font-weight: 600; } .ym .mm { color: var(--accent); } .ym .am { color: var(--muted); } .ym .sm { color: var(--gold); }
.ym .nd, .cell .nd { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--new); }
.yearsec { display: grid; gap: 8px; scroll-margin-top: 80px; }
.yearsec h3 { margin: 8px 0 0; font: 600 15px/1.2 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.yearsec h3 button { all: unset; cursor: pointer; display: inline-flex; align-items: center; min-height: 36px; }
.yearsec h3 button:hover { color: var(--accent); }
.yrow[data-dec] { scroll-margin-top: 80px; }
.yearbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.yearnav { display: flex; gap: 8px; align-items: center; }
.yearnav .btn { min-width: 44px; min-height: 44px; font-size: 20px; padding: 0; }
.yearnav strong { font: 700 24px/1 var(--f-display); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: center; }
.textmark { color: var(--accent); font-weight: 600; }
.footnote { font-size: 13px; color: var(--muted); margin: 0; max-width: 70ch; }
/* full board (wide screens) */
.board-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table.board { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; table-layout: fixed; }
.board th, .board td { border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
.board thead th { background: var(--surface); padding: 0; }
.board thead th:first-child { width: 64px; }
.board thead th button, .board tbody th button { all: unset; cursor: pointer; display: block; padding: 10px; font: 500 11px/1.2 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.board thead th button:hover, .board tbody th button:hover { color: var(--accent); }
.board tbody th { padding: 0; }
.board tbody th button { font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
.board td { padding: 4px; }
.cell { all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid transparent; }
.cell + .cell { margin-top: 4px; }
.cell:hover { border-color: var(--line); }
.cell:focus-visible { outline: 2px solid var(--accent); }
.cell .ct { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font: 500 13px/1.3 var(--f-read); }
.cell .ca { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell .cm { display: flex; gap: 4px; font-size: 12px; margin-top: 2px; }
.cell .cm:empty { display: none; }
.authorsec h3 .author-open { min-height: 44px; font-size: 17px; font-weight: 600; color: var(--accent); padding: 8px 0; }
#agent-dialog textarea { width: 100%; min-height: 240px; max-height: 50vh; resize: vertical; font-size: 16px; }
.cell .award-meta { display: block; margin-bottom: 4px; color: var(--accent); font-size: 12px; line-height: 1.4; }
.cell.has-text { background: var(--accent-soft); }
.cell.mine { border-style: dashed; border-color: var(--accent); }
/* author awards */
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 14px; cursor: pointer; text-align: left; min-width: 88px; min-height: 56px; }
.stat b { display: block; font: 600 22px/1 var(--f-display); }
.stat span { font-size: 13px; color: var(--muted); }

/* phones: bottom navigation, bigger targets */
.tabs .ti { display: none; width: 22px; height: 22px; }
@media (max-width: 719px) {
  .tabs.wrap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; max-width: none; margin: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; overflow: visible; background: var(--surface); border-top: 1px solid var(--line); padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 60px; padding: 6px 2px; border-radius: 0; font-size: 12px; line-height: 1.1; white-space: normal; text-align: center; }
  .tabs button[aria-selected="true"] { background: transparent; color: var(--accent); }
  .tabs button[aria-selected="true"] .ti { transform: translateY(-1px); }
  .tabs .ti { display: block; }
  .tabs .dot { position: absolute; top: 9px; left: calc(50% + 10px); margin: 0; }
  .iconbtn { width: 44px; height: 44px; }
  main .wrap { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .toast { bottom: calc(78px + env(safe-area-inset-bottom, 0px)); }
  body .sheet { bottom: calc(61px + env(safe-area-inset-bottom, 0px)); padding-bottom: 0; }
  .chip { min-height: 44px; }
  .chip-small { min-height: 40px; }
  .btn { min-height: 44px; }
  .star { min-width: 44px; min-height: 44px; }
  .slip .star { top: 4px; right: 4px; }
  .intro h2 { font-size: 20px; }
  .field input, .field select, .field textarea { font-size: 16px; }
}
@media (min-width: 900px) { .yrow { grid-template-columns: 72px minmax(0, 1fr) auto; } }

/* confirmation window: bottom sheet on phones, centered from 720px */
.modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(8, 10, 20, .55); }
.modal-card { width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; background: var(--surface); color: var(--ink); border-radius: 18px 18px 0 0; display: grid; gap: 14px; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 -8px 30px rgba(0, 0, 0, .25); }
.modal-card h3 { margin: 0; font: 700 20px/1.25 var(--f-display); text-wrap: balance; }
.modal-card > .small { margin: -8px 0 0; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; counter-reset: step; }
.steps li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; font-size: 16px; line-height: 1.45; }
.steps li::before { counter-increment: step; content: counter(step); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--ink); font: 600 14px/1 var(--f-mono); }
.steps li.done::before { content: "✓"; background: var(--ok-bg); color: var(--ok); }
.steps li > div { display: grid; gap: 8px; justify-items: start; min-width: 0; }
.copybox { display: block; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font: 13px/1.4 var(--f-mono); overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
.modal-actions { display: grid; gap: 8px; }
.modal-actions .btn { min-height: 48px; }
@media (prefers-reduced-motion: no-preference) { .modal-card { animation: rise .18s ease-out; } }
@media (min-width: 720px) {
  .modal { align-items: center; padding: 24px; }
  .modal-card { border-radius: 18px; padding: 24px; }
  .modal-actions { display: flex; flex-direction: row-reverse; justify-content: flex-start; }
}

/* ---------- design 01.11: light and calm. Jost for the interface, Literata only for reading.
   Pale blue page, white cards with a soft shadow instead of borders, one clear blue. ---------- */
:root {
  --bg: #f4f8ff; --surface: #ffffff; --ink: #01001a; --muted: #5a5d6b; --line: #e3e8f2;
  --accent: #0160ff; --accent-ink: #ffffff; --accent-soft: #e7efff;
  --f-display: 'Jost', system-ui, sans-serif; --f-ui: 'Jost', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --f-mono: 'Jost', system-ui, sans-serif;
  --radius: 12px; --shadow: 0 0 20px rgba(1, 0, 26, .07); --shadow-h: 0 6px 24px rgba(1, 0, 26, .11);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0d18; --surface: #141828; --ink: #eef1fa; --muted: #a4aabd; --line: #262c44;
  --accent: #5c9bff; --accent-ink: #050814; --accent-soft: #1a2850; --shadow: 0 0 0 1px #20263b; --shadow-h: 0 0 0 1px #33406a;
} }
:root[data-theme="dark"] {
  --bg: #0b0d18; --surface: #141828; --ink: #eef1fa; --muted: #a4aabd; --line: #262c44;
  --accent: #5c9bff; --accent-ink: #050814; --accent-soft: #1a2850; --shadow: 0 0 0 1px #20263b; --shadow-h: 0 0 0 1px #33406a;
}
body { font: 400 16px/1.55 var(--f-ui); -webkit-font-smoothing: antialiased; }
.top { border-bottom-color: transparent; box-shadow: 0 1px 0 var(--line); }
.brand { font: 600 21px/1 var(--f-display); letter-spacing: 0; }
.brand .logo { width: 24px; height: 24px; color: var(--accent); }
.brand-e { font-weight: 300; }
.motto { font: italic 400 17px/1.4 var(--f-ui); }
.iconbtn svg { width: 20px; height: 20px; }
.langs button { font: 500 13px/1 var(--f-ui); letter-spacing: .04em; min-height: 40px; } /* a finger-sized target */
.langs { flex: none; }
/* four languages do not fit next to the name on a phone: there a pill shows the current one and opens the phone's own list */
.lang-pick { display: none; position: relative; margin-left: auto; flex: none; align-items: center; gap: 4px; min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; font: 500 13px/1 var(--f-ui); letter-spacing: .04em; color: var(--ink); cursor: pointer; }
.lang-pick select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
.lang-pick:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 479px) { .langs { display: none; } .lang-pick { display: inline-flex; } }
@media (max-width: 380px) { .top .wrap { gap: 8px; } .top .iconbtn { margin-left: 0; } }
@media (max-width: 719px) { .tabs.wrap { padding-inline: 0; } .tabs button { white-space: nowrap; letter-spacing: 0; } } /* "O projekcie" on one line */
@media (max-width: 340px) { .tabs button { font-size: 11px; } }
@media (max-width: 340px) { .brand { font-size: 18px; gap: 6px; } .brand .logo { width: 20px; height: 20px; } .langs button { padding: 6px 8px; } .top .iconbtn { width: 40px; height: 40px; } }
/* cards: a soft shadow instead of a border */
.slip, .pick, .panel, .news, .recall, .ylist, .board-wrap { border-color: transparent; box-shadow: var(--shadow); }
.news { border-left: 3px solid var(--new); } .recall { border-left: 3px solid var(--accent); }
.slip:hover, .pick:hover { border-color: transparent; box-shadow: var(--shadow-h); }
.slip h3 { font: 500 19px/1.3 var(--f-display); }
.pick-t { font: 500 20px/1.25 var(--f-display); }
h2, .picks h2 { font-family: var(--f-display); font-weight: 500; letter-spacing: 0; }
.picks h2 { font-size: 26px; }
/* quiet labels: no capitals, no monospace */
.pick-meta, .slip-time, .rleft { font: 400 14px/1.35 var(--f-ui); letter-spacing: 0; color: var(--muted); }
.panel h4, .kicker, .rdone .rdone-k { font: 500 14px/1.3 var(--f-ui); letter-spacing: 0; text-transform: none; }

.tabs button[aria-selected="true"] { color: var(--accent); }
/* covers */
.cover { display: block; flex: none; border-radius: 3px 6px 6px 3px; background: var(--accent-soft); box-shadow: 0 2px 8px rgba(1, 0, 26, .14), inset 3px 0 0 rgba(0, 0, 0, .06); object-fit: cover; }

.cover-t .ct { font: 500 9px/1.15 var(--f-display); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: break-word; hyphens: auto; }

.cover-m.cover-t .ct { font-size: 17px; -webkit-line-clamp: 6; }
.cover-m.cover-t .ca { font-size: 12px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cover-t { background: hsl(var(--ch) 30% 24%); color: hsl(var(--ch) 40% 90%); } }
:root[data-theme="dark"] .cover-t { background: hsl(var(--ch) 30% 24%); color: hsl(var(--ch) 40% 90%); }
.pick-open { grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: start; }
.pick-txt { display: grid; gap: 4px; min-width: 0; }

@media (max-width: 359px) { .work-head { grid-template-columns: 96px minmax(0, 1fr); } .work-head .cover-m { width: 96px; height: 144px; } }
/* Jost everywhere; the serif stays only for the text you read and quotes from it */
:root { --f-read: 'Jost', system-ui, sans-serif; --f-book: 'Literata', Georgia, 'Noto Serif', serif; }
.rcontent, .rcontent h1, .rcontent h2, .rcontent h3, .stopq blockquote, .rmarks .mk button.go { font-family: var(--f-book); }

.cell .cm { align-items: center; }

.legend > span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }

.searchbar .search { flex: 1 1 auto; min-width: 0; min-height: 46px; font-size: 16px; border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); border-color: transparent; }

/* Visible error line: a broken page should say why instead of staying blank. */
function showFatal(msg) {
  let el = document.getElementById('fatal');
  if (!el) { el = document.createElement('div'); el.id = 'fatal'; el.setAttribute('role', 'alert'); el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad);border-radius:10px;padding:10px 12px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere'; document.body.appendChild(el); }

/* ============================================================
   unoebasta — one web page, nothing else: no app store, no backend, no accounts.

   ============================================================ */

/* ---------- award data (Wikidata) ---------- */
const DATA = JSON.parse(document.getElementById('awards-data').textContent);
const CATS = { h: ['N', 'A', 'E', 'S'], n: ['N', 'A', 'E', 'S'], l: ['N', 'SF', 'FN', 'HN', 'FT', 'A', 'E', 'S'] };

const TITLE_LANGS = Object.keys(DATA).filter(k => /^t_[a-z]{2,3}$/.test(k)).map(k => k.slice(2));
const bareTitle = s => String(s).replace(/\s*\((?:[^()]*\s)?(?:novel|novella|short story|powieść|opowiadanie|nowela|роман|рассказ|повесть|novela|relato|cuento)(?:\s[^()]*)?\)\s*$/iu, ''); // a Wikipedia note such as "(роман)"
function titlesOf(q, w) { const o = {}; for (const l of TITLE_LANGS) if (DATA['t_' + l][q]) o[l] = bareTitle(DATA['t_' + l][q]); if (w[1]) o.pl = bareTitle(w[1]); if (w[2]) o.ru = bareTitle(w[2]); return o; }
for (const [q, w] of Object.entries(DATA.works)) WORKS[q] = { id: q, title: w[0], titles: titlesOf(q, w), authors: w[3], isfdb: w[4] || null, fantlab: w[5] || null, pub: w[6] || null, about: (w[7] || w[8] || w[9]) ? { en: w[7] || null, pl: w[8] || null, ru: w[9] || null } : null, wiki: { en: w[10] || null, pl: w[11] || null, ru: w[12] || null }, ex: (DATA.ex && DATA.ex[q]) || null, gb: (DATA.gb && DATA.gb[q]) || null, ol: (DATA.ol && DATA.ol[q]) || null, awards: [] };
for (const [aw, cat, y, q, over] of DATA.aw) { const w = WORKS[q]; if (!w) continue; w.awards.push([aw, cat, y]); if (over) w.title = over; }
for (const w of Object.values(WORKS)) w.awards.sort((a, b) => a[2] - b[2] || AWARDS.indexOf(a[0]) - AWARDS.indexOf(b[0]));
const AUTHORS = {};
for (const [q, a] of Object.entries(DATA.authors)) AUTHORS[q] = { id: q, name: { en: a[0], pl: a[1] || null, ru: a[2] || null }, desc: { en: a[3] || null, pl: a[4] || null, ru: a[5] || null }, isfdb: a[6] || null, fantlab: a[7] || null, born: a[8] || null, died: a[9] || null, wiki: { en: a[10] || null, pl: a[11] || null, ru: a[12] || null }, bio: { en: a[13] || null, pl: a[14] || null, ru: a[15] || null } };
const YEARS = (() => { const r = {}; for (const aw of AWARDS) { const ys = DATA.aw.filter(x => x[0] === aw).map(x => x[2]); r[aw] = [Math.min(...ys), Math.max(...ys)]; } return r; })();
// board index: BOARD[aw][year][cat] = [qid, …]
const BOARD = {};
for (const [aw, cat, y, q] of DATA.aw) { ((BOARD[aw] = BOARD[aw] || {})[y] = BOARD[aw][y] || {}); (BOARD[aw][y][cat] = BOARD[aw][y][cat] || []).push(q); }

/* ---------- curated reading layer: legal sources checked by hand ---------- */
// tier: t1 = CC / public domain everywhere (offline OK); t2 = free online at the rights holder; t2us = public domain in the US only; t3 = excerpt
// w: words in the story body, measured on the publisher's page 31.10.2026 (estimates for PDFs and collections) — drives reading time

      ['library', 'every winner whose full text is free online. Filter by award, length, audio and bookmarks; a dot on the tab means something new.'],

    about_app_h: 'Where a text opens', about_app: 'Read ↗ opens a story on the magazine’s site, where it was published: a browser does not let one site load another site’s page. Your own file (EPUB, FB2, TXT, HTML, DOCX, ODT) opens right here, in the reader: your font and theme, your place kept, bookmarks and the phone’s voice. Add it in {s:shelf-files}.',
    about_data_h: 'Your data', about_data: 'Links, files, bookmarks, your place, notes and finished marks are kept on this device. There are no accounts. If you turn on sync, your shelf travels between your devices encrypted: the servers see only ciphertext. Your own files never leave the device. To move without sync, open {s:shelf-data} on My shelf: “Link for another device” (or its QR code) brings your places, notes and marks; Export makes a full copy, with your files.',
    about_src_h: 'Sources', about_code: 'The code and data are open: suggest a text, report a broken link, help with a translation or the code.', about_src: "unoebasta is a non-commercial catalog of links to publishers, authors, public-domain archives and external recordings. External sources with unverified permission are labelled separately. A source listing does not prove a recording is complete. Award data comes from Wikidata (CC0); descriptions name their sources, including Wikipedia and FantLab. Story texts and recordings remain on their source sites.",
    demo_btn: 'Try the reader on a sample', demo_title: 'How the reader keeps your place',
    demo: [
      'This short sample lets you test the reader. Scroll a little, close it, then open it again: it returns to the paragraph where you stopped.',
      'Your place is saved as the number of the paragraph, how far into it you were, and a short fingerprint of its first words. If the text is reformatted, the fingerprint finds the same paragraph again.',
      'In the reader, the bookmark button marks the current paragraph and the list button shows all bookmarks in this text. Bookmarks also appear on your shelf.',
      'The position is written a second or two after you stop scrolling, when you switch to another tab and when you close the reader. Each record is about two hundred bytes.',
      'Nothing leaves this device. To move your shelf to another phone, use Export on the shelf and paste the text there.',
      'A tap on the text hides the buttons; another tap brings them back. Under Aa: text size, light or dark theme and paragraph highlight. The bar shows how many minutes are left.',
      'Files you add, such as an EPUB from a publisher or a TXT released under Creative Commons, open in this same reader and work without a connection.',
      'That is all. Scroll to the end and close the reader to see your progress on the shelf.'
    ],

    about_h: 'Как устроен unoebasta',
    name_note: 'Название по-итальянски: uno e basta, «одно — и хватит». Ещё одна страница или один рассказ, и на сегодня всё.', about_for_h: 'Для кого',
    about_for: 'unoebasta — для тех, у кого мало времени и трудно удержать внимание: для занятых людей и читателей с СДВГ. Не нужно выбирать из сотен книг и помнить, где остановились. Рассказ — это целая история за один присест.',
    about_for_list: [
      'Сколько есть времени? Несколько минут, около часа или больше: на вкладке {v:catalog} три рассказа нужной длины. Время примерное: каждый читает в своём темпе.',
      'Одно главное действие на экране: «Читать» или «Слушать». Без серий, баллов и счётчиков.',
      'Когда вы возвращаетесь, приложение напоминает, где вы остановились: последний абзац и ваша заметка. Всё, что вы читаете, — в разделе {s:shelf-reading}.',
      'Слушать вместо чтения: подкаст журнала, ElevenReader или голос телефона. Что выбирать по умолчанию — в разделе {s:shelf-listen}.',
      'Подсветка абзаца, панель читалки, которая не мешает, светлая и тёмная темы.',
      '«Отметить прочитанным»: книга уходит из подборки, и список становится короче. Прочитанные книги — в разделе {s:shelf-done}.'
    ],
    about_tabs_h: 'Разделы',
    about_tabs: [
      ['catalog', 'три рассказа на то время, что у вас есть: несколько минут, около часа или больше. Если вы что-то читаете, первым будет «Продолжить чтение» с вашим местом и заметкой.'],
      ['library', 'все лауреаты с бесплатным полным текстом. Фильтры по премии, длине, аудио и закладкам; точка на вкладке — значит, появилось новое.'],
      ['awards', 'все победители «Хьюго», «Небьюлы» и «Локуса» с 1953 года, по категориям и годам. У каждой книги своя карточка: издания, фрагменты, переводы, своя ссылка или файл.'],

    about_app_h: 'Где открывается текст', about_app: '«Читать ↗» открывает рассказ на сайте журнала, где он вышел: браузер не даёт одному сайту загрузить страницу другого. Свой файл (EPUB, FB2, TXT, HTML, DOCX, ODT) открывается прямо здесь, в читалке: свой шрифт и тема, место сохраняется, есть закладки и голос телефона. Добавьте его в разделе {s:shelf-files}.',
    about_data_h: 'Ваши данные', about_data: 'Ссылки, файлы, закладки, место чтения, заметки и отметки «Прочитано» хранятся на этом устройстве. Аккаунтов нет. Если включить синхронизацию, полка переходит между вашими устройствами в зашифрованном виде: серверы видят только шифр. Свои файлы никогда не покидают устройство. Чтобы перенести данные без синхронизации, откройте на полке раздел {s:shelf-data}: «Ссылка для другого устройства» (или её QR-код) переносит места, заметки и отметки, а «Экспорт» делает полную копию со своими файлами.',
    about_src_h: 'Источники', about_code: 'Код и данные открыты: можно предложить текст, сообщить о сломанной ссылке, помочь с переводом или кодом.', about_src: "unoebasta — некоммерческий каталог ссылок на издателей, авторов, архивы общественного достояния и внешние аудиозаписи. Источники с неподтверждённым разрешением отмечены отдельно. Описание источника не доказывает полноту записи. Данные о премиях — из Wikidata (CC0); у аннотаций указаны источники, включая Википедию и FantLab. Тексты и записи остаются на исходных сайтах.",
    demo_btn: 'Попробовать ридер на примере', demo_title: 'Как ридер запоминает место',
    demo: [
      'Этот короткий текст нужен, чтобы проверить ридер. Прокрутите немного, закройте его и откройте снова: он вернётся к абзацу, на котором вы остановились.',
      'Место сохраняется как номер абзаца, насколько вы в него углубились, и короткий отпечаток первых слов. Если вёрстка текста изменится, по отпечатку найдётся тот же абзац.',
      'В читалке кнопка закладки отмечает текущий абзац, а кнопка списка показывает все закладки в этом тексте. Закладки появляются и на полке.',
      'Позиция записывается через секунду-две после остановки прокрутки, при переходе на другую вкладку и при закрытии ридера. Одна запись занимает около двухсот байт.',
      'Ничего не покидает это устройство. Чтобы перенести полку на другой телефон, сделайте экспорт на полке и вставьте текст там.',
      'Касание текста прячет кнопки, следующее касание возвращает их. Под Aa — размер текста, светлая или тёмная тема и подсветка абзаца. Вверху видно, сколько минут осталось.',

/* ---------- small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let LANG = 'en';
function t(key, vars) {
  let s = (I18N[LANG] && I18N[LANG][key]);
  if (s == null) s = I18N.en[key];
  if (s == null) return key;
  if (vars && typeof s === 'string') s = s.replace(/\{(\w+)\}/g, (_, k) => vars[k] != null ? vars[k] : '');
  return s;
}
function plural(n, forms) {
  if (forms.length === 2) return n === 1 ? forms[0] : forms[1];
  const m10 = n % 10, m100 = n % 100;
  if (LANG === 'pl') return n === 1 ? forms[0] : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? forms[1] : forms[2];
  return m10 === 1 && m100 !== 11 ? forms[0] : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? forms[1] : forms[2];
}
const locale = () => LANG === 'en' ? 'en-GB' : LANG;
const fmtNum = n => Number(n).toLocaleString(locale());
const fmtDate = ms => new Date(ms).toLocaleDateString(locale(), { day: 'numeric', month: 'long' });
function fmtBytes(b) { if (b == null) return '—'; const u = ['B', 'KB', 'MB', 'GB']; let i = 0; while (b >= 1024 && i < 3) { b /= 1024; i++; } return (i ? b.toFixed(1) : b) + ' ' + u[i]; }
function hash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function toast(msg, act) { const el = $('#toast'); el.innerHTML = esc(msg) + (act ? `<button class="toast-act" data-${act.k}="${esc(act.v)}">${esc(act.label)}</button>` : ''); el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { el.hidden = true; }, act ? 6000 : 3200); }
const MOTTO = '20 minute adventure'; // the motto stays in English in every language, like the name
const awardName = a => t('aw_' + a);
const catName = c => t('cat_' + c);
const authorName = q => { const a = AUTHORS[q]; return a ? (a.name[LANG] || a.name.en) : ''; };
const authorsLine = w => w.authors.map(authorName).join(', ');
const work = q => WORKS[q];
const readInfo = q => READ[q] || null;
const hasText = q => !!(READ[q] && READ[q].links.some(l => l.kind === 'full'));
const hasAudio = q => !!(READ[q] && READ[q].links.some(l => l.kind === 'audio'));
// The title in the interface language (a text's own translated title first), else null: then the original is shown.
const altTitle = w => { const r = READ[w.id]; const o = r && r.alt && r.alt[LANG]; if (o) return o; return (w.titles && w.titles[LANG]) || null; };
const titleOf = w => altTitle(w) || w.title;
const origOf = w => { const a = altTitle(w); return a && a !== w.title ? w.title : null; };
// what a reading record is called: its own name for a file, the work's title in the interface language otherwise
const recTitle = (p, w) => (w && (!p.title || p.title === w.title)) ? titleOf(w) : p.title;
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };
const latestYear = w => Math.max(...w.awards.map(a => a[2]));

/* ---------- covers ----------
   Novels and novellas with an image in covers/ (fetched from Open Library by scripts/fetch-covers.mjs;
   the build lists them in DATA.covers): s = 80×120 for lists, m = 160×240 for the work card.
   Everything else gets a typographic cover drawn here: title and author on a quiet colour. */
let COVERS = null;
function coverHtml(q, size) {
  const w = WORKS[q]; if (!w) return '';

// What can be read today, counted from the data itself: the list grows with readers' help
function coverageHtml() {
  const rows = Object.fromEntries(FORM_ORDER.map(f => [f, { all: 0, full: 0, frag: 0, audio: 0 }])), langs = { en: 0, pl: 0, ru: 0, es: 0 };
  for (const q of Object.keys(WORKS)) {
    const r = rows[formOf(q)]; if (!r) continue; r.all++;
    const a = availability(q), v = Object.values(a);
    if (v.includes('full')) r.full++; if (v.includes('part')) r.frag++;
    if (READ[q] && READ[q].links.some(l => l.kind === 'audio')) r.audio++;
    for (const l in langs) if (a[l] === 'part') langs[l]++;
  }
  const CAT = { novel: 'N', novella: 'A', novelette: 'E', short: 'S' }, n = fmtNum;
  const tot = k => FORM_ORDER.reduce((s, f) => s + rows[f][k], 0);

/* ---------- sync through public Nostr relays ----------
   Your devices share one secret "shelf key" (32 random bytes), made here and carried once by a link or QR code
   (#sync=…, never sent to a server). From it come a Nostr signing key and a random label. The shelf (syncPack)
   is compressed, encrypted to itself with NIP-44 and published as one replaceable app-data event
   (kind 30078, NIP-78) to several relays run by different people. Relays see only ciphertext; the main copy

const syncState = () => { try { return JSON.parse(localStorage.getItem(SYNC_LS) || 'null'); } catch (e) { return null; } };

  if (d.avText) { AV.onlyText = !AV.onlyText; saveAV(); return renderAwards(); }
  if (d.avCat) { AV.cat = d.avCat; AV.year = null; saveAV(); return renderAwards(); }
  if (d.avCatGo) { AV.cat = d.avCatGo; AV.mode = 'cats'; AV.year = null; saveAV(); renderAwards(); return window.scrollTo(0, 0); }
  if (d.avYear !== undefined) { if (!d.avYear) return; AV.year = +d.avYear; renderAwards(); return window.scrollTo(0, 0); }
  if (d.avClear) { AV.year = null; return renderAwards(); }
  if (d.jump) { const el = $(`#view-awards [data-dec="${d.jump}"]`); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
  // reading and files
  if (d.readfile) return openFile(d.readfile);
  if (d.notefile) { const fm = document.querySelector(`[data-fileform="${d.notefile}"]`); if (fm) { fm.hidden = !fm.hidden; if (!fm.hidden) fm.querySelector('input').focus(); } return; }
  if (d.noteclose) { const fm = document.querySelector(`[data-fileform="${d.noteclose}"]`); if (fm) fm.hidden = true; return; }
  if (d.delfile) return deleteShelfItems('files', d.delfile);
  // recall
  if (d.more) { const box = document.getElementById(d.more); if (box) { const open = box.classList.toggle('clamp') === false; b.textContent = t(open ? 'about_less' : 'about_more'); b.setAttribute('aria-expanded', String(open)); } return; }
  if (d.rcgo) { const p = posFor(d.rcgo); closeRecallDialog(); if (p) { skipRecallOnce = true; return openByKey(p.id, p.workId); } return; }
  if (d.rcopen) { const p = posFor(d.rcopen); if (p) openRecallDialog(p, false); return; }
  if (d.rcpick) { recallPick = d.rcpick; renderCatalog(); const h = $('#rc-h'); if (h) h.scrollIntoView({ block: 'nearest' }); return; }
  if (d.rchide) { const p = posFor(d.rchide); if (p) { p.hide = true; await Store.put('positions', p); if (recallPick === p.id) recallPick = null; toast(t('rc_hidden')); } return renderCatalog(); }
  if (d.rcnote) { const fm = b.closest('.recall').querySelector('form.rc-noteform'); if (fm) { fm.hidden = !fm.hidden; if (!fm.hidden) fm.querySelector('textarea').focus(); } return; }
  if (d.rcnoteclose) { b.closest('form').hidden = true; return; }
  if (d.hjump) { const r = local.bookmarks.find(x => x.id === d.hjump); if (!r) return; if (R && R.key === r.key) { closeRecallDialog(); restorePosition(r, true); return; } closeRecallDialog(); skipRecallOnce = true; return openByKey(r.key, r.workId, r); }
  if (d.hdel) { await Store.del('bookmarks', d.hdel); local.bookmarks = local.bookmarks.filter(x => x.id !== d.hdel); const li = b.closest('li'); if (li) li.remove(); return; }
  if (d.rdgo) return closeRecallDialog(true);
  if (d.rdtop) { closeRecallDialog(); $('#reader').scrollTop = 0; updateProg(); return; }
  if (d.rdclose) return closeRecallDialog();
  if (d.rdleave) { closeRecallDialog(); return closeReader(); } // you only looked: no note asked
  if (d.exskip) { closeExit(); return closeReader(); }
  if (d.exdone) { if (!R || !R.workId) return; const q = R.workId; savePosition(); const note = ($('#ex-note') && $('#ex-note').value || '').trim(); if (note) await saveRecallNote(R.key, note, R.recallId); await setDone(q, true); closeExit(); closeReader(); return toast(t('done_toast', { t: work(q).title }), { k: 'undone', v: q, label: t('done_undo') }); }
  if (d.exnever) { prefs.askNote = false; savePrefs(); closeExit(); return closeReader(); }
  if (d.elevenfile) return elevenFile(d.elevenfile);
  if (d.eleven) return elevenUrl(d.eleven, d.wid);
  // listening: phone voice, the ▾ choice sheet, a choice remembered for the Listen button
  if (d.say) return sayWork(d.say);
  if (d.lsrc) return openListenSheet(d.lsrc);
  if (d.lclose) return closeListen();
  if (d.lgo) {
    const q = d.wid; const o = listenOpts(q).find(x => x.id === d.lgo); const keep = !!($('#ls-remember') && $('#ls-remember').checked);
    if (o && o.id === 'phone') sayUnlock(); // inside the tap, before anything else
    closeListen(); if (!o) return;
    const choice = o.type === 'audio' ? 'pod' : o.id;
    if (keep && (prefs.listen || 'pod') !== choice) { prefs.listen = choice === 'pod' ? null : choice; savePrefs(); renderCatalog(); if (!$('#sheet-work').hidden) openWork(q); toast(t('ls_saved', { s: choice === 'pod' ? t('ls_pod_any') : o.name })); }
    return listenGo(q, o);
  }
  if (d.edclose) return closeEleven();
  if (d.edcopy) { try { await navigator.clipboard.writeText(d.edcopy); toast(t('copied')); const li = b.closest('li'); if (li) li.classList.add('done'); } catch (err) { const box = b.parentElement.querySelector('.copybox'); if (box) { const r = document.createRange(); r.selectNodeContents(box); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } } return; }
  if (d.gbview) return openGbViewer(d.gbview, d.gbid, d.gblang, d.wid);
  if (d.form) return openForm(d.form, d.wid);
  if (d.gobm) { const bm = local.bookmarks.find(x => x.id === d.gobm); if (bm) return openByKey(bm.key, bm.workId, bm); return; }
  if (d.delbm) return deleteShelfItems('bm', d.delbm);
  if (d.resume) { const p = posFor(d.resume); if (p) return openByKey(p.id, p.workId); return; }
  if (b.id === 'own-link-save') {
    const url = $('#own-link').value.trim(); let ok = false; try { ok = /^https?:$/.test(new URL(url).protocol); } catch (e2) {}
    if (!ok) { toast(t('own_link_bad')); $('#own-link').focus(); return; }
    const note = ($('#own-note').value || '').trim().slice(0, 200);
    await Store.put('links', { id: d.wid, url, note, book: bookOf(d.wid), at: Date.now() }); toast(t('own_link_saved')); await loadLocal(); return openWork(d.wid);
  }
  if (b.id === 'own-link-del') { await Store.del('links', d.wid); await loadLocal(); return openWork(d.wid); }
  if (b.id === 'own-link-edit' || b.id === 'own-link-cancel') { const f = $('#own-form'), c = $('#own-card'); const edit = b.id === 'own-link-edit'; if (f) f.hidden = !edit; if (c) c.hidden = edit; if (edit) $('#own-link').focus(); return; } // the saved link is a card; the form only to change it
  if (b.id === 'open-demo') return openDemo();
  if (d.mvgo) { const pk = movePack; closeMove(); if (!pk) return; const n = await syncMerge(pk); return toast(n ? t('mv_done', { n }) : t('mv_same')); }
  if (d.mvclose) return closeMove();
  if (d.sygo) { const key = pairKey; closeMove(); if (!key) return; const r = await syncTurnOn(key); return toast(r ? t('sy_done', { n: r.n || 0 }) : t('sy_fail')); }
  if (b.id === 'sy-on') { b.disabled = true; await syncTurnOn(); await renderShelf(); return showSyncPair(); }
  if (b.id === 'sy-pair') return showSyncPair();
  if (b.id === 'sy-now') { const r = await syncNow(); if (r) toast(r.n ? t('mv_done', { n: r.n }) : t('sy_uptodate')); return; }
  if (b.id === 'sy-off') return syncTurnOff();
  if (b.id === 'mv-make') return makeMoveLink();
  if (b.id === 'mv-copy') { try { await navigator.clipboard.writeText(moveLinkNow); toast(t('copied')); } catch (err) { const i = $('#mv-link'); if (i) { i.focus(); i.select(); } } return; }
  if (b.id === 'mv-share') { try { await navigator.share({ title: 'unoebasta', url: moveLinkNow }); } catch (err) {} return; }
  if (b.id === 'do-export') { $('#io-text').value = await exportAll(); $('#io-hint').textContent = t('export_hint'); return; }
  if (b.id === 'do-import') return importAll($('#io-text').value);
  if (b.id === 'do-copy-io' || b.id === 'copy-sugg' || b.id === 'sg-copy') {
    const ta = b.id === 'do-copy-io' ? $('#io-text') : b.id === 'copy-sugg' ? $('#sugg-text') : $('#sg-text');
    try { await navigator.clipboard.writeText(ta.value); toast(t('copied')); } catch (err) { ta.focus(); ta.select(); }
  }
});
document.addEventListener('change', e => {
  if (e.target.matches('input[type="file"]')) importFile(e.target);
  if (e.target.id === 'lang-sel' && e.target.value !== LANG) { LANG = e.target.value; prefs.lang = LANG; savePrefs(); applyTheme(); refreshAll(); }
  if (e.target.id === 'set-asknote') { prefs.askNote = e.target.checked; savePrefs(); }
  if (e.target.id === 'set-listen') { prefs.listen = e.target.value || null; savePrefs(); renderCatalog(); }
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'ex-form') { e.preventDefault(); if (R) { savePosition(); await saveRecallNote(R.key, $('#ex-note').value, R.recallId); } closeExit(); return closeReader(); }
  const rf = e.target.closest('form[data-rcform]');
  if (rf) { e.preventDefault(); await saveRecallNote(rf.dataset.rcform, rf.querySelector('textarea').value); toast(t('rc_note_saved')); return refreshRecallViews(); }
  const fm = e.target.closest('form[data-fileform]'); if (!fm) return;
  e.preventDefault();
  const f = await Store.get('files', fm.dataset.fileform); if (!f) return;
  f.note = fm.querySelector('input').value.trim().slice(0, 200);
  await Store.put('files', f); const k = local.files.findIndex(x => x.id === f.id); if (k >= 0) local.files[k] = f;
  toast(t('file_note_saved'));
  if (!$('#sheet-work').hidden && f.workId) openWork(f.workId); else renderShelf();
});
let qT = null;
function runSearch(id, val) {
  if (id === 'av-q') { AV.q = val.trim(); renderAwards(true); }
  if (id === 'lib-q') { filter.q = val.trim(); renderLibrary(true); }
}
document.addEventListener('input', e => {
  if (e.target.id !== 'av-q' && e.target.id !== 'lib-q') return;
  clearTimeout(qT); const id = e.target.id, val = e.target.value;
  qT = setTimeout(() => runSearch(id, val), 250);
});
document.addEventListener('submit', e => {
  const f = e.target.closest && e.target.closest('form[data-sform]'); if (!f) return;
  e.preventDefault(); clearTimeout(qT);
  const inp = f.querySelector('input'); runSearch(inp.id, inp.value);
  inp.blur(); // close the phone keyboard so the results are visible
});
function closeTopLayer() {
  if (!$('#agent-dialog').hidden) return closeAgentTask();
  if (!$('#move-dialog').hidden) return closeMove();
  if (!$('#listen-dialog').hidden) return closeListen();
  if (!$('#eleven-dialog').hidden) return closeEleven();
  if (!$('#exit-dialog').hidden) { closeExit(); return closeReader(); }
  if (!$('#recall-dialog').hidden) return closeRecallDialog(true);
  if (!$('#reader').hidden) return requestCloseReader();
  for (const s of ['#sheet-gb', '#sheet-form', '#sheet-author', '#sheet-work']) { const el = $(s); if (!el.hidden) { el.hidden = true; el.innerHTML = ''; renderCatalog(); return; } }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTopLayer(); });
// Back on a phone: while a window, a card or the reader is open, one history entry stands for it,
// so Back closes the top layer instead of leaving the page. Closing it with a button removes that entry.
const openLayers = () => [...document.querySelectorAll('#reader, .sheet, .modal')].some(el => !el.hidden);
let navPushed = false, ignoreUntil = 0; // our own history.back() is not a Back press (its popstate may come late or never)
function syncNav() {
  const open = openLayers();
  try {
    if (open && !navPushed) { history.pushState({ ub: 1 }, ''); navPushed = true; }
    else if (!open && navPushed) { navPushed = false; if (history.state && history.state.ub) { ignoreUntil = Date.now() + 700; history.back(); } }
  } catch (e) {}
}
window.addEventListener('popstate', () => {
  if (Date.now() < ignoreUntil) { ignoreUntil = 0; return; }
  if (!navPushed) return;
  navPushed = false; closeTopLayer(); syncNav();
});
new MutationObserver(syncNav).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });

if (window.matchMedia) { const mq = window.matchMedia('(min-width: 900px)'); const re = () => { if (VIEW === 'awards') renderAwards(); }; if (mq.addEventListener) mq.addEventListener('change', re); else if (mq.addListener) mq.addListener(re); }

/* ---------- start ---------- */
(function start() {
  const nav = (navigator.language || 'en').slice(0, 2);
  LANG = prefs.lang || (['ru', 'pl', 'es'].includes(nav) ? nav : 'en');
  initVisit();
  // draw the page from the catalog first, then fill in what is stored on the device
  applyLang(); applyTheme(); renderCatalog(); renderAbout();
  try { window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {}
  setView('catalog');
  ensureSchema().catch(e => console.warn('[unoebasta] schema', e)).then(() => refreshAll()).then(() => checkMoveLink()).then(() => { if (syncState() && !location.hash) { syncLast = Date.now(); syncNow(true); } }).catch(e => showFatal('start: ' + (e && (e.stack || e.message) || e)));
})();
