name: Suggest a text
description: A text, excerpt, audio or publication lead for a Hugo, Nebula or Locus winner
title: "Text: "
labels: ["text"]
body:
  - type: markdown
    attributes:
      value: |
        Share a matching public link from a publisher, author, archive or external portal. Describe access, what you checked, and permission evidence separately; unknown permission is welcome as unknown. Do not upload story bodies, recordings or personal data.
  - type: input
    id: work
    attributes:
      label: Work and author
      placeholder: "Cat Pictures Please — Naomi Kritzer"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link to text, excerpt, audio or publication page
      placeholder: "https://…"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Who published it
      options:
        - The magazine or publisher (free on their site)
        - The author's own site
        - Creative Commons
        - Public domain
        - External portal or narrator channel (permission unknown)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: lang
    attributes:
      label: Language of the text
      options: [English, Polish, Russian, Spanish, Other]
    validations:
      required: true
  - type: input
    id: audio
    attributes:
      label: Audio, if there is one (optional)
      placeholder: "https://… podcast episode"
  - type: textarea
    id: note
    attributes:
      label: What did you check?
      description: Author, title, language, full text or fragment, player or sampled playback, and login, payment or regional restrictions. Runtime alone does not prove a complete recording.
  - type: textarea
    id: permission
    attributes:
      label: Permission or license evidence (optional)
      description: Link to the rights-holder statement or license if known. Otherwise say unknown; do not infer permission from public access.
  - type: checkboxes
    id: verified
    attributes:
      label: Check
      options:
        - label: I opened the page and described what I could verify, including any uncertainty
          required: true
