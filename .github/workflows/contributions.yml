name: Findings submission
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Trusted base only. Never checkout, install dependencies or execute code from the PR.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate new CSV and notes against trusted catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTRIBUTION_REPO: ${{ github.repository }}
          CONTRIBUTION_PR: ${{ github.event.pull_request.number }}
          CONTRIBUTION_HEAD: ${{ github.event.pull_request.head.sha }}
          CONTRIBUTION_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-contribution-pr.mjs
