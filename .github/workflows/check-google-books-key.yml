name: Continue multilingual search
on:
  push:
    branches: [verify-google-books-key-20261102]
    paths: [.github/workflows/check-google-books-key.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7b0aa3f08df5783c3b209a99bb2c26e704c7ff5f
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Continue one real batch
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: npm run search:continue -- --limit 50
      - name: Show results
        if: always()
        run: |
          cat .cache/search/report.json
          npm run search -- list
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat .cache/search/report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve research and review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-continuation
          path: |
            .cache/search/state.json
            .cache/search/plan.json
            .cache/search/report.json
            data/research/
          retention-days: 30
