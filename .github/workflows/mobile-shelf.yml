name: Mobile shelf
on:
  pull_request:
    paths: [src/index.html, test/mobile-shelf.test.cjs, .github/workflows/mobile-shelf.yml]
  push:
    branches: [main]
    paths: [src/index.html, test/mobile-shelf.test.cjs, .github/workflows/mobile-shelf.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install chromium --with-deps --only-shell
      - run: npm run build
      - run: node test/mobile-shelf.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-shelf
          path: .cache/mobile-shelf/
          if-no-files-found: ignore
          retention-days: 14
